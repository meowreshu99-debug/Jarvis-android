<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050914" />
  <title>RESHU — Personal Assistant</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL ASSISTANT</div>
        <h1>R.E.S.H.u.</h1>
      </div>
      <div class="status"><span class="dot"></span> ONLINE</div>
    </header>

    <section class="orb-panel" aria-label="Assistant status">
      <div class="orb"><div class="orb-core"></div></div>
      <div class="listening" id="listening">READY</div>
      <p>Voice + text assistant</p>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div class="message assistant">
        <span class="label">RESHU</span>
        <p>Hello. Your personal assistant foundation is online. Try “Hey reshu” or type a message.</p>
      </div>
    </section>

    <form class="composer" id="composer">
      <button type="button" class="mic" id="mic" aria-label="Use microphone">🎙</button>
      <input id="input" autocomplete="off" placeholder="Talk to RESHU..." />
      <button class="send" type="submit">➤</button>
    </form>

    <nav class="quick">
      <button data-command="What is your status?">STATUS</button>
      <button data-command="Hello reshu">HELLO</button>
      <button data-command="What time is it?">TIME</button>
    </nav>

    <footer>
      Stage 1 • Responsive for phone + desktop • Local foundation
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
